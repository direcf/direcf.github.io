<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- accent bar left -->
  <rect x="80" y="160" width="4" height="310" fill="url(#accent)" rx="2"/>

  <!-- logo circle -->
  <circle cx="120" cy="120" r="36" fill="url(#accent)" opacity="0.15"/>
  <text x="120" y="128" font-family="Georgia, serif" font-size="32" font-weight="700" fill="url(#accent)" text-anchor="middle">d</text>

  <!-- brand -->
  <text x="170" y="128" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#e2e8f0" letter-spacing="2">direcf</text>

  <!-- main title -->
  <text x="110" y="270" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">direct fun,</text>
  <text x="110" y="350" font-family="Georgia, serif" font-size="64" font-weight="700" fill="url(#accent)" letter-spacing="-1">deep study.</text>

  <!-- description -->
  <text x="110" y="420" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="0.5">AI 시대를 살아가며 공부한 것들과 가끔의 사적인 단상</text>

  <!-- bottom tags -->
  <rect x="110" y="490" width="130" height="36" rx="18" fill="#6366f1" opacity="0.15"/>
  <text x="175" y="513" font-family="-apple-system, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">Machine Learning</text>

  <rect x="256" y="490" width="100" height="36" rx="18" fill="#6366f1" opacity="0.15"/>
  <text x="306" y="513" font-family="-apple-system, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">Computer Vision</text>

  <rect x="372" y="490" width="100" height="36" rx="18" fill="#6366f1" opacity="0.15"/>
  <text x="422" y="513" font-family="-apple-system, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">AI Engineering</text>

  <!-- url -->
  <text x="1120" y="580" font-family="-apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="end">direcf.github.io</text>
</svg>
