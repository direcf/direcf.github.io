  <rect x="20" y="16" width="678" height="108" rx="10" fill="#FFF9C4" stroke="#E0C840" stroke-width="2"/>
  <text x="359" y="56" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial" fill="#222">7. RTSP and RTP – The Backbone of Video Streaming</text>
  <text x="359" y="92" text-anchor="middle" font-size="17" font-family="Arial" fill="#666">(RTSP와 RTP — 실시간 영상 스트리밍의 뼈대)</text>
  <text x="690" y="38" text-anchor="end" font-size="11" font-family="Arial" fill="#aaa">🍌 Nano Banana</text>
  <text x="359" y="560" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial" fill="#555">Key Takeaways</text>
  <text x="359" y="600" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• RTSP = 리모컨: 재생/중지/탐색 제어 명령 전달. TCP로 신뢰성 있게 전송. 포트 554.</text>
<text x="359" y="638" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• RTP = 배달부: 실제 영상/음성 데이터를 UDP로 빠르게 전송. 타임스탬프+시퀀스번호</text>
<text x="359" y="676" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• RTCP = 품질 리포터: 패킷 손실률, 지연 시간 보고 → Adaptive Bitrate 조절에 활용</text>
<text x="359" y="714" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• UDP 선택 이유: 1초 전 프레임 완벽 복구보다 지금 이 순간의 영상이 중요하기 때문</text>
  <rect x="20" y="916" width="678" height="84" rx="10" fill="#C8F0D0" stroke="#40B840" stroke-width="2"/>
  <text x="359" y="952" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#2a6a2a">🔧 엔지니어를 위한 한 줄 요약:</text>
  <text x="359" y="982" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">재생/중지/탐색 제어 명령 전달. TCP로 신뢰성 있게 전송. 포트 554.</text>
</svg>