<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#eef4fb"/>
  <!-- bg card -->
  <rect x="16" y="16" width="368" height="208" rx="12" fill="#fff" stroke="#cfdbe8" stroke-width="1.5"/>

  <!-- CLIP box -->
  <rect x="32" y="36" width="100" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="82" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a8a" font-weight="700">CLIP</text>
  <text x="82" y="72" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">image+text</text>

  <!-- arrow -->
  <line x1="132" y1="60" x2="156" y2="60" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Flamingo box -->
  <rect x="156" y="36" width="100" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="206" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6" font-weight="700">Flamingo</text>
  <text x="206" y="72" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">few-shot VLM</text>

  <!-- arrow down -->
  <line x1="206" y1="84" x2="206" y2="108" stroke="#6a7a92" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- LLaMA box -->
  <rect x="32" y="108" width="100" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="82" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534" font-weight="700">LLaMA</text>
  <text x="82" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">오픈소스 sLLM</text>

  <!-- arrow -->
  <line x1="132" y1="132" x2="156" y2="132" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Alpaca box -->
  <rect x="156" y="108" width="100" height="48" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="206" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#713f12" font-weight="700">Alpaca</text>
  <text x="206" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">instruction tuning</text>

  <!-- arrow -->
  <line x1="256" y1="132" x2="280" y2="132" stroke="#ca8a04" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Vicuna box -->
  <rect x="280" y="108" width="100" height="48" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="330" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#831843" font-weight="700">Vicuna ⭐</text>
  <text x="330" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">ShareGPT 70K</text>

  <!-- title -->
  <text x="200" y="188" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#0f1f3a" font-weight="800">멀티모달 LLM 기초 연구</text>
  <text x="200" y="206" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a7a92">CLIP · Flamingo · LLaMA · Vicuna</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
