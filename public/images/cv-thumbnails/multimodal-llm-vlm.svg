<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#eef4fb"/>
  <rect x="16" y="16" width="368" height="208" rx="12" fill="#fff" stroke="#cfdbe8" stroke-width="1.5"/>

  <!-- Vision Encoder -->
  <rect x="30" y="50" width="90" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a" font-weight="700">Vision</text>
  <text x="75" y="83" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a" font-weight="700">Encoder</text>

  <!-- arrow -->
  <line x1="120" y1="72" x2="148" y2="72" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Alignment -->
  <rect x="148" y="50" width="80" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="188" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#5b21b6" font-weight="700">Align-</text>
  <text x="188" y="83" text-anchor="middle" font-family="monospace" font-size="9" fill="#5b21b6" font-weight="700">ment</text>

  <!-- arrow -->
  <line x1="228" y1="72" x2="256" y2="72" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>

  <!-- LLM -->
  <rect x="256" y="36" width="110" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="311" y="68" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534" font-weight="700">LLM</text>
  <text x="311" y="86" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">Vicuna / LLaMA</text>

  <!-- text input arrow -->
  <line x1="311" y1="36" x2="311" y2="20" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="311" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a7a92">text input</text>

  <!-- output arrow -->
  <line x1="366" y1="72" x2="384" y2="72" stroke="#16a34a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="393" y="76" font-family="monospace" font-size="9" fill="#6a7a92">→</text>

  <!-- LoRA badge -->
  <rect x="30" y="120" width="82" height="30" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="71" y="139" text-anchor="middle" font-family="monospace" font-size="10" fill="#831843" font-weight="700">LoRA</text>

  <!-- LLaMA Adapter badge -->
  <rect x="122" y="120" width="110" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="177" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#713f12" font-weight="700">LLaMA Adapter v2</text>

  <!-- PEFT label -->
  <rect x="242" y="120" width="50" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="267" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#166534" font-weight="700">PEFT</text>

  <!-- title -->
  <text x="200" y="182" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#0f1f3a" font-weight="800">VLM과 Fine-tuning</text>
  <text x="200" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a7a92">LLaVA · LoRA · LLaMA Adapter v2</text>
  <text x="200" y="216" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">Part 2 / 멀티모달 LLM 시리즈</text>

  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
