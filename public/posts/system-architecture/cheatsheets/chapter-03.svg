  <rect x="20" y="16" width="678" height="108" rx="10" fill="#FFF9C4" stroke="#E0C840" stroke-width="2"/>
  <text x="359" y="56" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial" fill="#222">3. TCP vs UDP</text>
  <text x="359" y="92" text-anchor="middle" font-size="17" font-family="Arial" fill="#666">(신뢰성 vs 속도, 어느 길을 선택할 것인가)</text>
  <text x="690" y="38" text-anchor="end" font-size="11" font-family="Arial" fill="#aaa">🍌 Nano Banana</text>
  <text x="359" y="560" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial" fill="#555">Key Takeaways</text>
  <text x="359" y="600" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• TCP = 등기 우편: 3-way handshake, ACK 확인, 재전송 → 100% 순서 보장, 느림</text>
<text x="359" y="638" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• UDP = 전단지 배포: handshake 없음, 확인 없음 → 빠름, 손실 가능</text>
<text x="359" y="676" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• WebSocket은 TCP: AI 분석 결과 텍스트는 한 글자도 빠지면 안 되므로 TCP 선택</text>
<text x="359" y="714" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• RTSP/RTP는 UDP: 1초 전 영상 복구를 기다리느라 현재 영상이 멈추면 안 되므로 UDP 선택</text>
  <rect x="20" y="916" width="678" height="84" rx="10" fill="#C8F0D0" stroke="#40B840" stroke-width="2"/>
  <text x="359" y="952" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#2a6a2a">🔧 엔지니어를 위한 한 줄 요약:</text>
  <text x="359" y="982" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">3-way handshake, ACK 확인, 재전송 → 100% 순서 보장, 느림</text>
</svg>