  <rect x="20" y="16" width="678" height="108" rx="10" fill="#FFF9C4" stroke="#E0C840" stroke-width="2"/>
  <text x="359" y="56" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial" fill="#222">3. The Loading Architecture: How Claude Reads Your Files</text>
  <text x="359" y="92" text-anchor="middle" font-size="17" font-family="Arial" fill="#666">(로딩 아키텍처 — Claude는 파일들을 어떻게 읽는가)</text>
  <text x="690" y="38" text-anchor="end" font-size="11" font-family="Arial" fill="#aaa">🍌 Nano Banana</text>
  <text x="359" y="560" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial" fill="#555">Key Takeaways</text>
  <text x="359" y="600" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 4계층 로딩 순서를 외워라: 글로벌 → 프로젝트 → 로컬 → 서브디렉토리(지연). 더 구체적인 것이 더 일반적인 것을 오버라이드한다.</text>
<text x="359" y="638" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 서브디렉토리는 지연 로딩이다: 세션 초반에 영향을 줘야 하는 규칙은 반드시 루트 레벨에 두어야 한다.</text>
<text x="359" y="676" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• settings.json 5단계 체계: Managed > CLI > 사용자 global > 프로젝트 > 로컬. 팀 공유는 프로젝트에, 개인 취향은 로컬에.</text>
<text x="359" y="714" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 실시간 리로드를 활용하라: settings.json 변경은 재시작 없이 즉시 반영된다. ConfigChange 훅으로 리로드 이벤트에 반응할 수</text>
  <rect x="20" y="916" width="678" height="84" rx="10" fill="#C8F0D0" stroke="#40B840" stroke-width="2"/>
  <text x="359" y="952" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#2a6a2a">🔧 엔지니어를 위한 한 줄 요약:</text>
  <text x="359" y="982" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">글로벌 → 프로젝트 → 로컬 → 서브디렉토리(지연). 더 구체적인 것이 더 일반적인 것을 오버라이드한다.</text>
</svg>