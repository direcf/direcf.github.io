  <text x="359" y="952" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#2a6a2a">🔧 엔지니어를 위한 한 줄 요약:</text>
  <text x="359" y="982" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">단순한 스킬 모음이 아니라 전체 개발 방법론(brainstorm→plan→TDD→review)을 강제하는 시스템이다.</text>
