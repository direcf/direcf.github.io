  <text x="359" y="56" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial" fill="#222">9. Expert Configurations: How Top Practitioners Use Claude Code</text>
  <text x="359" y="92" text-anchor="middle" font-size="17" font-family="Arial" fill="#666">(고수들의 세팅 — 해외 최고 전문가들의 Claude Code 환경)</text>
  <text x="690" y="38" text-anchor="end" font-size="11" font-family="Arial" fill="#aaa">🍌 Nano Banana</text>
  <text x="359" y="560" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial" fill="#555">Key Takeaways</text>
  <text x="359" y="600" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• Superpowers = 방법론 자동화: 단순한 스킬 모음이 아니라 전체 개발 방법론(brainstorm→plan→TDD→review)을 강제하는 시스템이다.</text>
<text x="359" y="638" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 9가지 첫날 설정: 모델 명시, 안전 명령 허용, 위험 명령 금지, 포맷터 훅 — 이 조합이 바로 사용 가능한 기반을 만든다.</text>
<text x="359" y="676" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 실수 → CLAUDE.md 추가: 이 피드백 루프가 팀의 Claude를 점점 강력하게 만든다. 주간 리뷰 루틴으로 강화하라.</text>
<text x="359" y="714" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 복잡도 기반 모드 선택: 모든 작업에 Plan Mode를 쓸 필요는 없다. 복잡도에 따라 Normal/Plan/Ultraplan을 의도적으로 </text>
