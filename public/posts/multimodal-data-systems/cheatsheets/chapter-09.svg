ine x1="0" y1="0" x2="0" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="40" y1="0" x2="40" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="80" y1="0" x2="80" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="120" y1="0" x2="120" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="160" y1="0" x2="160" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="200" y1="0" x2="200" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="240" y1="0" x2="240" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="280" y1="0" x2="280" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="320" y1="0" x2="320" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="360" y1="0" x2="360" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="400" y1="0" x2="400" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="440" y1="0" x2="440" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="480" y1="0" x2="480" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="520" y1="0" x2="520" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="560" y1="0" x2="560" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="600" y1="0" x2="600" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="640" y1="0" x2="640" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/><line x1="680" y1="0" x2="680" y2="1024" stroke="#E8E8D8" stroke-width="0.8"/>
  <rect x="20" y="16" width="678" height="108" rx="10" fill="#FFF9C4" stroke="#E0C840" stroke-width="2"/>
  <text x="359" y="56" text-anchor="middle" font-size="30" font-weight="bold" font-family="Arial" fill="#222">9. Evaluation Framework Design</text>
  <text x="359" y="92" text-anchor="middle" font-size="17" font-family="Arial" fill="#666">(평가 프레임워크 설계)</text>
  <text x="690" y="38" text-anchor="end" font-size="11" font-family="Arial" fill="#aaa">🍌 Nano Banana</text>
  <text x="359" y="560" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial" fill="#555">Key Takeaways</text>
  <text x="359" y="600" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 잘못된 메트릭 = 잘못된 방향 최적화: Accuracy vs AUC vs PR-AUC — 클래스 불균형, 비용 비대칭을 고려해 태스크에 맞는 메트릭을 선택해</text>
<text x="359" y="638" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• Offline ≠ Online 성능: Offline validation 성능이 좋아도 A/B 테스트에서 비즈니스 KPI가 개선되지 않을 수 있다. 두 레이</text>
<text x="359" y="676" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• A/B 테스트는 통계다: 표본 크기, 검정력(power), 유의수준을 계산해야 한다. 임의로 기간을 설정하면 거짓 양성이 발생한다.</text>
<text x="359" y="714" text-anchor="middle" font-size="13" fill="#444" font-family="Arial">• 보정(Calibration)은 확률의 신뢰성: 모델이 70%라고 출력하면 실제로 70%를 맞춰야 한다. 의료, 금융, 법률 도메인에서 필수적이다.</text>
  <rect x="20" y="916" width="678" height="84" rx="10" fill="#C8F0D0" stroke="#40B840" stroke-width="2"/>
  <text x="359" y="952" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#2a6a2a">🔧 엔지니어를 위한 한 줄 요약:</text>
  <text x="359" y="982" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">Accuracy vs AUC vs PR-AUC — 클래스 불균형, 비용 비대칭을 고려해 태스크에 맞는 메트릭을 선택해야 한다.</text>
</svg>